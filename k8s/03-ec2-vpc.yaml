# EC2/VPC/IAM/STS control plane. EC2/VPC state lives in-process, in-memory -
# deliberately kept at replicas: 1. Scaling this out would mean a
# DescribeVpcs on one pod not seeing a CreateVpc that landed on another
# (the Service load-balances randomly across pods), which is strictly worse
# for what this is: a Terraform-testing convenience, not a service meant to
# scale. See the s3 Deployment for the part of this project that's actually
# built to run as many replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ec2-vpc
  namespace: aws-emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ec2-vpc
  template:
    metadata:
      labels:
        app: ec2-vpc
    spec:
      # uid/gid 10001 is the `appuser` baked into the image (see
      # Dockerfile) - matching it here isn't strictly required for
      # runAsNonRoot to work (any non-zero UID would do), but keeps the
      # filesystem ownership the image already set up (chown'd at build
      # time) consistent with what actually runs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ec2-vpc
          image: ghcr.io/farhansabbir/aws_emulator:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICE_MODE
              value: ec2
          envFrom:
            - configMapRef:
                name: aws-emulator-config
            - secretRef:
                name: aws-emulator-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ec2-vpc
  namespace: aws-emulator
spec:
  selector:
    app: ec2-vpc
  ports:
    - port: 4566
      targetPort: 4566
  # type: LoadBalancer  # or NodePort / an Ingress, depending on your cluster
