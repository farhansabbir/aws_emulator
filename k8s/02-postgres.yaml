# Single-instance Postgres for IAM + S3 metadata. A Deployment (not a
# StatefulSet) is enough here: there's only ever one replica, so we don't
# need ordinal pod identity or per-replica volumes - just a Pod backed by
# one PVC. For anything beyond local testing, point DATABASE_URL (in
# 01-config.yaml) at a managed Postgres instead and drop this file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: aws-emulator
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aws-emulator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: aws-emulator-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aws_emulator"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aws-emulator
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
