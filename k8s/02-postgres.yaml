# Single-instance Postgres for IAM + S3 metadata. A Deployment (not a
# StatefulSet) is enough here: there's only ever one replica, so we don't
# need ordinal pod identity or per-replica volumes - just a Pod backed by
# one PVC. For anything beyond local testing, point DATABASE_URL (in
# 01-config.yaml) at a managed Postgres instead and drop this file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: aws-emulator
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aws-emulator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Not runAsNonRoot/runAsUser here: the official postgres image's
      # entrypoint needs to start as root to fix up ownership/permissions
      # on the mounted data dir before it drops to the postgres user
      # itself (gosu) - forcing a non-root UID from the start skips that
      # step entirely and the container fails to initialize. Verified
      # against docker-compose's equivalent hardening: this exact
      # capability set is what the entrypoint actually needs, no more.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: aws-emulator-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aws_emulator"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aws-emulator
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
