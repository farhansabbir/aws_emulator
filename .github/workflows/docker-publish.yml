name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aws_emulator
          POSTGRES_USER: aws_emulator
          POSTGRES_PASSWORD: aws_emulator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aws_emulator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aws_emulator:smoke-test .

      - name: Run emulator (all mode) against the postgres service
        run: |
          docker run -d --name emulator \
            --network host \
            -e SERVICE_MODE=all \
            -e DATABASE_URL=postgresql://aws_emulator:aws_emulator@localhost:5432/aws_emulator \
            -e S3_AUTH_MODE=enforce \
            aws_emulator:smoke-test
          for i in $(seq 1 30); do
            curl -sf -X POST http://localhost:4566/ -d Action=GetCallerIdentity >/dev/null && break
            sleep 1
          done

      - name: Install awscli
        run: pip install --quiet awscli

      - name: Exercise EC2/VPC
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          EP=http://localhost:4566
          VPC_ID=$(aws --endpoint-url "$EP" ec2 create-vpc --cidr-block 10.0.0.0/16 --query 'Vpc.VpcId' --output text)
          aws --endpoint-url "$EP" ec2 describe-vpcs --vpc-ids "$VPC_ID" | grep -q CidrBlockAssociationSet
          SUBNET_ID=$(aws --endpoint-url "$EP" ec2 create-subnet --vpc-id "$VPC_ID" --cidr-block 10.0.10.0/24 --availability-zone us-east-1a --query 'Subnet.SubnetId' --output text)
          aws --endpoint-url "$EP" ec2 run-instances --image-id ami-12345678 --instance-type t2.micro --subnet-id "$SUBNET_ID" --count 1 | grep -q '"Code": 16'

      - name: Exercise IAM + SigV4-authenticated S3
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          EP=http://localhost:4566
          aws --endpoint-url "$EP" iam create-user --user-name ci-smoke-test
          AK=$(aws --endpoint-url "$EP" iam create-access-key --user-name ci-smoke-test)
          export AWS_ACCESS_KEY_ID=$(echo "$AK" | python3 -c "import json,sys; print(json.load(sys.stdin)['AccessKey']['AccessKeyId'])")
          export AWS_SECRET_ACCESS_KEY=$(echo "$AK" | python3 -c "import json,sys; print(json.load(sys.stdin)['AccessKey']['SecretAccessKey'])")

          aws --endpoint-url "$EP" s3 mb s3://ci-smoke-bucket
          echo "hello from CI" > /tmp/smoke.txt
          aws --endpoint-url "$EP" s3 cp /tmp/smoke.txt s3://ci-smoke-bucket/smoke.txt
          aws --endpoint-url "$EP" s3 ls s3://ci-smoke-bucket/ | grep -q smoke.txt
          aws --endpoint-url "$EP" s3 cp s3://ci-smoke-bucket/smoke.txt /tmp/smoke-downloaded.txt
          diff /tmp/smoke.txt /tmp/smoke-downloaded.txt

      - name: Emulator logs (always, for debugging)
        if: always()
        run: docker logs emulator || true

  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
