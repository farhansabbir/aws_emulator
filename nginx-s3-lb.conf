# Written under a non-root, read-only-rootfs container (see
# docker-compose.yml's s3-lb service) - the pidfile has to live somewhere
# writable, and /tmp is the one path that's mounted as tmpfs there.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker Compose's embedded DNS server. Re-resolving on every request
    # (via the `set $upstream` trick below, instead of a static upstream
    # block resolved once at startup) is what makes this round-robin across
    # however many `s3` replicas are currently running.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 0;

    server {
        listen 4566;

        location / {
            set $upstream http://s3:4566;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            # $host strips the port; SigV4 signs the Host header verbatim
            # (the client signed "s3-lb:4566", not "s3-lb"), so forwarding
            # $host instead of $http_host breaks every signed request's
            # signature the moment a non-default port is in play - which it
            # always is here.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
