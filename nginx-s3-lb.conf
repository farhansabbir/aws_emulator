events {
    worker_connections 1024;
}

http {
    # Docker Compose's embedded DNS server. Re-resolving on every request
    # (via the `set $upstream` trick below, instead of a static upstream
    # block resolved once at startup) is what makes this round-robin across
    # however many `s3` replicas are currently running.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 0;

    server {
        listen 4566;

        location / {
            set $upstream http://s3:4566;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
